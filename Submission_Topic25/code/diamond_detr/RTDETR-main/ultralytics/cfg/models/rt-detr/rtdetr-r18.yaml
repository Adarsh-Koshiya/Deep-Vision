# RT-DETR-r18 baseline (Ultralytics fork 8.0.201)
# ResNet-18-like backbone + AIFI encoder + RepC3 bidirectional FPN + RTDETRDecoder
# Reference: arXiv:2304.08069

nc: 80  # overridden at runtime by data.yaml

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]     # 0  P1/2   (320x320x64)
  - [-1, 1, Conv, [64, 3, 1]]     # 1         (320x320x64)
  - [-1, 1, Conv, [128, 3, 2]]    # 2  P2/4   (160x160x128)
  - [-1, 3, RepC3, [128]]         # 3         (160x160x128)
  - [-1, 1, Conv, [256, 3, 2]]    # 4  P3/8   (80x80x256)
  - [-1, 6, RepC3, [256]]         # 5  P3     (80x80x256)
  - [-1, 1, Conv, [512, 3, 2]]    # 6  P4/16  (40x40x512)
  - [-1, 6, RepC3, [512]]         # 7  P4     (40x40x512)
  - [-1, 1, Conv, [1024, 3, 2]]   # 8  P5/32  (20x20x1024)
  - [-1, 3, RepC3, [1024]]        # 9  P5     (20x20x1024)

head:
  # --- Encoder ---
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 10  P5 proj 1024→256 (no act)
  - [-1, 1, AIFI, [1024, 8]]                        # 11  AIFI encoder
  - [-1, 1, Conv, [256, 1, 1]]                      # 12  F5 lateral (256)

  # --- Top-down: P4 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 13  upsample F5
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]]    # 14  P4 proj 512→256 (no act)
  - [[-2, -1], 1, Concat, [1]]                      # 15  cat [upsample, P4_proj] → 512
  - [-1, 3, RepC3, [256]]                           # 16  F4 (256)

  # --- Top-down: P3 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]      # 17  upsample F4
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]    # 18  P3 proj 256→256 (no act)
  - [[-2, -1], 1, Concat, [1]]                      # 19  cat [upsample, P3_proj] → 512
  - [-1, 3, RepC3, [256]]                           # 20  F3 (256)  ← P3 detect

  # --- Bottom-up PAN ---
  - [-1, 1, Conv, [256, 3, 2]]                      # 21  downsample F3
  - [[-1, 16], 1, Concat, [1]]                      # 22  cat [F3_down, F4] → 512
  - [-1, 3, RepC3, [256]]                           # 23  P4 detect (256)

  - [-1, 1, Conv, [256, 3, 2]]                      # 24  downsample
  - [[-1, 12], 1, Concat, [1]]                      # 25  cat [down, F5_lateral] → 512
  - [-1, 3, RepC3, [256]]                           # 26  P5 detect (256)

  - [[20, 23, 26], 1, RTDETRDecoder, [nc]]          # Detect(P3, P4, P5)
